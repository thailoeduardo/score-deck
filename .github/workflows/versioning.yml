name: Auto Versioning

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      increment_type:
        description: 'Tipo de incremento (MAJOR, MINOR, PATCH)'
        required: true
        default: 'PATCH'
        type: choice
        options:
          - MAJOR
          - MINOR
          - PATCH

jobs:
  versioning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Configurar Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Obter última versão
        id: version
        run: |
          LAST_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          VERSION=${LAST_VERSION#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          echo "Versão atual: $MAJOR.$MINOR.$PATCH"

          # Usar o input do workflow para definir o tipo de incremento
          INCREMENT_TYPE="${{ github.event.inputs.increment_type }}"

          case $INCREMENT_TYPE in
            MAJOR)
              ((MAJOR++))
              MINOR=0
              PATCH=0
              ;;
            MINOR)
              ((MINOR++))
              PATCH=0
              ;;
            PATCH)
              ((PATCH++))
              ;;
            *)
              echo "Tipo de incremento inválido. Use MAJOR, MINOR ou PATCH."
              exit 1
              ;;
          esac

          NEW_VERSION="v$MAJOR.$MINOR.$PATCH"
          echo "Nova versão: $NEW_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Criar e publicar nova tag
        run: |
          git tag -a "$NEW_VERSION" -m "Versão $NEW_VERSION"
          git push origin "$NEW_VERSION"
