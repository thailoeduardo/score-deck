name: Auto Versioning

on:
  push:
    branches:
      - master

jobs:
  versioning:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Configurar Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Obter última versão
        id: version
        run: |
          LAST_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          VERSION=${LAST_VERSION#v}
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
      
          # Initialize MAJOR, MINOR, PATCH if they are empty
          : ${MAJOR:=0}
          : ${MINOR:=0}
          : ${PATCH:=0}
      
          # Obtém a mensagem do último commit
          LAST_COMMIT_MSG=$(git log -1 --pretty=%B)
      
          # Decide qual versão incrementar com base na mensagem do commit
          if [[ "$LAST_COMMIT_MSG" == *"BREAKING CHANGE"* ]]; then
            ((MAJOR++))
            MINOR=0
            PATCH=0
          elif [[ "$LAST_COMMIT_MSG" == feat:* ]]; then
            ((MINOR++))
            PATCH=0
          else
            ((PATCH++))
          fi

          NEW_VERSION="v$MAJOR.$MINOR.$PATCH"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Criar e publicar nova tag
        run: |
          git tag -a "$NEW_VERSION" -m "Versão $NEW_VERSION"
          git push origin "$NEW_VERSION"
