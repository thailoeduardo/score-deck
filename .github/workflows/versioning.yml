name: Auto Versioning

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      increment_type:
        description: 'Tipo de incremento (MAJOR, MINOR, PATCH)'
        required: true
        default: 'PATCH'
        type: choice
        options:
          - MAJOR
          - MINOR
          - PATCH

jobs:
  versioning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Garante que todas as tags sejam buscadas

      - name: Configurar Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Obter última versão
        id: version
        run: |
          # Obtém a última tag ou usa um valor padrão
          LAST_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0.0")
          VERSION=${LAST_VERSION#v}
      
          # Extrai números da versão
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
      
          # Garante que valores não fiquem vazios
          MAJOR=${MAJOR:-0}
          MINOR=${MINOR:-0}
          PATCH=${PATCH:-0}
      
          echo "Versão atual: $MAJOR.$MINOR.$PATCH"
      
          # Garante que a variável sempre tenha um valor válido
          INCREMENT_TYPE="${{ github.event.inputs.increment_type || 'PATCH' }}"
      
          case $INCREMENT_TYPE in
            MAJOR)
              ((MAJOR++))
              MINOR=0
              PATCH=0
              ;;
            MINOR)
              ((MINOR++))
              PATCH=0
              ;;
            PATCH)
              ((PATCH++))
              ;;
            *)
              echo "Tipo de incremento inválido. Use MAJOR, MINOR ou PATCH."
              exit 1
              ;;
          esac
      
          NEW_VERSION="v$MAJOR.$MINOR.$PATCH"
          echo "Nova versão: $NEW_VERSION"
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV


      - name: Verificar se a tag já existe
        run: |
          if git rev-parse "$NEW_VERSION" >/dev/null 2>&1; then
            echo "Tag $NEW_VERSION já existe. Abortando."
            exit 1
          fi

      - name: Criar e publicar nova tag
        run: |
          git tag -a "$NEW_VERSION" -m "Versão $NEW_VERSION"
          git push origin "$NEW_VERSION"
